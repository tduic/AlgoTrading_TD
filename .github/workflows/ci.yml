name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      # TD Ameritrade's API (and the tda/tdameritrade clients) no longer exist;
      # the tests stub tda, selenium and webdriver_manager, so only pytest is needed.
      - name: Install test runner
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Byte-compile (warnings are errors)
        run: python -W error -m compileall -q -x '/\.git/' .
      - name: Run tests (offline; broker and browser are faked)
        run: python -m pytest -v
